name: scarvs
description: A Ecommerce App :) .

publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  concentric_transition: ^1.0.1+1
  eva_icons_flutter: ^4.0.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  flutter_svg: ^2.3.2
  image_picker: ^1.2.4
  lottie: ^3.7.0
  provider: ^6.0.1
  salomon_bottom_bar: ^3.1.0
  shared_preferences: ^2.0.8
  shimmer: ^3.0.0
  supabase_flutter: ^2.8.0
  google_fonts: ^8.2.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  flutter_test:
    sdk: flutter

flutter_native_splash:
  color: "#42a5f5"
  image: assets/splash.png
  android: true
  ios: true
  web: true

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/logo/logo.png"

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/animations/
    - assets/images/shoes/
    - assets/images/misc/
    - assets/images/logo/
    - .env

  fonts:
    - family: Contax
      fonts:
        - asset: assets/fonts/contax.ttf
